name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: fileswap/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: fileswap/server/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker build + health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f fileswap/server/Dockerfile -t fileswap fileswap
      - name: Start container and check /health
        run: |
          docker run -d --name fileswap -p 3000:3000 fileswap
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs fileswap
          exit 1
