services:
  fileswap:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Host port (override with FILESWAP_PORT=xxxx); the container always listens on 3000
      - "${FILESWAP_PORT:-7341}:3000"
    environment:
      PORT: 3000
      SESSION_TTL_MS: 1800000
      MAX_MSG_BYTES: 16384
      MAX_SESSIONS: 50000
      RATE_LIMIT_PER_MIN: 120
      # Behind Caddy or another reverse proxy: real client IPs (X-Forwarded-For) and HSTS.
      # Set to 0 if this port is reachable from the internet directly, without a proxy.
      TRUST_PROXY: 1
      MAX_CONN_PER_IP: 20
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Re-build and run the container:
# sudo docker compose up --build -d
